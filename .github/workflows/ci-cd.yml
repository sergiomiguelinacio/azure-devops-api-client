name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  DOTNET_VERSION: '9.0.x'
  NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'

jobs:
  # Build and Test Job
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Needed for GitVersion
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 📦 Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: 🔍 Find Main Project
      id: find-project
      run: |
        MAIN_PROJECT=$(find src -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" | head -1)
        echo "main_project=$MAIN_PROJECT" >> $GITHUB_OUTPUT
        echo "📦 Main project: $MAIN_PROJECT"
    
    - name: 📦 Restore Dependencies
      run: dotnet restore ${{ steps.find-project.outputs.main_project }}
    
    - name: 🔨 Build
      run: dotnet build ${{ steps.find-project.outputs.main_project }} --configuration Release --no-restore
    
    - name: 🧪 Run Tests
      run: |
        # Find and run all test projects
        TEST_PROJECTS=$(find . -name "*Test*.csproj" -o -name "*Tests*.csproj" | grep -v bin | grep -v obj)
        
        if [ -z "$TEST_PROJECTS" ]; then
          echo "ℹ️ No test projects found"
        else
          echo "🧪 Found test projects:"
          echo "$TEST_PROJECTS"
          
          for TEST_PROJECT in $TEST_PROJECTS; do
            echo "🧪 Running tests for: $TEST_PROJECT"
            dotnet test "$TEST_PROJECT" \
              --configuration Release \
              --no-build \
              --verbosity minimal \
              --collect:"XPlat Code Coverage" \
              --results-directory ./TestResults/
          done
        fi
    
    - name: 📊 Upload Coverage to Codecov
      if: github.event_name != 'pull_request'
      uses: codecov/codecov-action@v4
      with:
        directory: ./TestResults/
        fail_ci_if_error: false
        verbose: true
    
    - name: 📤 Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ github.run_number }}
        path: |
          src/**/bin/Release/
          !src/**/bin/Release/**/ref/
          !src/**/bin/Release/**/*.pdb
        retention-days: 7

  # Package Job (only on main branch or releases)
  package:
    name: 📦 Create Package
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    outputs:
      package-version: ${{ steps.version.outputs.version }}
      package-path: ${{ steps.package.outputs.package-path }}
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 🏷️ Determine Version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          VERSION=${VERSION#v} # Remove 'v' prefix if present
        else
          # Use semantic versioning with build number for main branch
          VERSION="1.0.${{ github.run_number }}"
        fi
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📋 Package Version: $VERSION"
    
    - name: 🔍 Find Main Project
      id: find-project
      run: |
        MAIN_PROJECT=$(find src -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" | head -1)
        echo "main_project=$MAIN_PROJECT" >> $GITHUB_OUTPUT
        echo "📦 Main project: $MAIN_PROJECT"
    
    - name: 📦 Restore Dependencies
      run: dotnet restore ${{ steps.find-project.outputs.main_project }}
    
    - name: 🔨 Build Release
      run: |
        dotnet build ${{ steps.find-project.outputs.main_project }} \
          --configuration Release \
          --no-restore \
          -p:Version=${{ steps.version.outputs.version }}
    
    - name: 📦 Create NuGet Package
      id: package
      run: |
        PACKAGE_OUTPUT="./packages"
        mkdir -p "$PACKAGE_OUTPUT"
        
        dotnet pack ${{ steps.find-project.outputs.main_project }} \
          --configuration Release \
          --no-build \
          --output "$PACKAGE_OUTPUT" \
          -p:PackageVersion=${{ steps.version.outputs.version }}
        
        PACKAGE_FILE=$(find "$PACKAGE_OUTPUT" -name "*.nupkg" | head -1)
        echo "package-path=$PACKAGE_FILE" >> $GITHUB_OUTPUT
        echo "📦 Package created: $PACKAGE_FILE"
    
    - name: 📤 Upload Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package-${{ steps.version.outputs.version }}
        path: ${{ steps.package.outputs.package-path }}
        retention-days: 30

  # Publish Job (only on releases)
  publish:
    name: 🚀 Publish to NuGet
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'release'
    environment: production
    
    steps:
    - name: 📥 Download Package
      uses: actions/download-artifact@v4
      with:
        name: nuget-package-${{ needs.package.outputs.package-version }}
        path: ./packages
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 🚀 Publish to NuGet.org
      run: |
        PACKAGE_FILE=$(find ./packages -name "*.nupkg" | head -1)
        echo "📦 Publishing: $PACKAGE_FILE"
        
        dotnet nuget push "$PACKAGE_FILE" \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source ${{ env.NUGET_SOURCE }} \
          --skip-duplicate
    
    - name: 📋 Create Release Summary
      run: |
        echo "## 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Package Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ needs.package.outputs.package-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **NuGet**: [AzureDevOpsApi](https://www.nuget.org/packages/AzureDevOpsApi)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Installation" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "dotnet add package AzureDevOpsApi --version ${{ needs.package.outputs.package-version }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
