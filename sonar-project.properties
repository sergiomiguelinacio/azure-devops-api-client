# SonarCloud Configuration for Azure DevOps API Client
sonar.projectKey=azure-devops-api-client
sonar.organization=your-organization

# Project Information
sonar.projectName=Azure DevOps API Client
sonar.projectVersion=1.0.0

# Source Code
sonar.sources=src/
sonar.tests=src/AzureDevopsApi.UnitTests/,src/AzureDevopsApiFunctionalTests/,src/AzureDevopsApiIntegrationTests/

# Language Configuration
sonar.language=cs
sonar.dotnet.framework=net9.0

# Coverage Configuration
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/*.trx

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/packages/**,**/*.Designer.cs,**/AssemblyInfo.cs,src/Examples/**
sonar.test.exclusions=**/bin/**,**/obj/**

# Quality Gate
sonar.qualitygate.wait=true

# Analysis Configuration
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# .NET Specific
sonar.dotnet.excludeGeneratedCode=true
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# Code Duplication
sonar.cpd.exclusions=**/Dto/**,**/Models/**

# Security
sonar.security.hotspots.inheritFromParent=true
